<style>
:root{

  --dark:#050E07;--dark2:#0A1A0C;--dark3:#0F2415;
  --cream:#FDF8E7;--ivory:#FAF3DC;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--dark);color:var(--cream);font-family:'Cormorant Garamond',serif;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--dark);}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}

/* ── ANIMATIONS ── */
@keyframes shimmer{0%,100%{opacity:.6;}50%{opacity:1;}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:1;}100%{transform:translateY(-100vh) rotate(360deg);opacity:0;}}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 15px var(--gold);}50%{box-shadow:0 0 40px var(--gold-light),0 0 80px var(--gold);}}
@keyframes rotate-slow{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
@keyframes glow-text{0%,100%{text-shadow:0 0 20px var(--gold),0 0 40px var(--gold-light);}50%{text-shadow:0 0 40px var(--gold),0 0 80px var(--gold-light),0 0 120px var(--gold);}}
@keyframes lantern-sway{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
@keyframes crescent-glow{0%,100%{filter:drop-shadow(0 0 10px var(--gold));}50%{filter:drop-shadow(0 0 30px var(--gold-light));}}
@keyframes heart-float{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-200px) scale(0);opacity:0;}}
@keyframes sparkle{0%,100%{transform:scale(0) rotate(0);opacity:0;}50%{transform:scale(1) rotate(180deg);opacity:1;}}
@keyframes countdown-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
@keyframes border-dance{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
@keyframes slide-in-right{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes modal-in{from{transform:scale(.8);opacity:0;}to{transform:scale(1);opacity:1;}}

.animate-shimmer{animation:shimmer 2s ease-in-out infinite;}
.animate-float{animation:floatUp linear infinite;}
.animate-pulse-gold{animation:pulse-gold 2s ease-in-out infinite;}
.animate-rotate{animation:rotate-slow 20s linear infinite;}
.animate-fadeInUp{animation:fadeInUp .8s ease forwards;}
.animate-glow{animation:glow-text 3s ease-in-out infinite;}
.animate-sway{animation:lantern-sway 3s ease-in-out infinite;}
.animate-crescent{animation:crescent-glow 3s ease-in-out infinite;}
.animate-countdown{animation:countdown-pulse 1s ease-in-out infinite;}

/* ── GLASS CARD ── */
.glass{background:rgba(13,79,46,.25);backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,.3);}

/* ── GEOMETRIC PATTERN ── */

/* ── PREMIUM INPUT ── */

.premium-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 20px rgba(212,175,55,.3);}
.premium-input::placeholder{color:rgba(253,248,231,.4);}

/* ── GOLD BUTTON ── */
.btn-gold{background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-light));color:#050E07;font-weight:700;font-family:'Cinzel Decorative',serif;letter-spacing:.1em;transition:all .3s;position:relative;overflow:hidden;}
.btn-gold::before{content:'';position:absolute;top:-50%;left:-60%;width:50%;height:200%;background:rgba(255,255,255,.3);transform:skewX(-20deg);transition:all .5s;}
.btn-gold:hover::before{left:120%;}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(212,175,55,.5);}

/* ── TIMELINE ── */
.timeline-line{background:linear-gradient(to bottom,transparent,var(--gold),transparent);}

/* ── GALLERY ── */
.gallery-item{transition:all .4s;cursor:pointer;}
.gallery-item:hover{transform:scale(1.03);z-index:10;}
.gallery-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,14,7,.9),transparent);opacity:0;transition:opacity .3s;}
.gallery-item:hover .gallery-overlay{opacity:1;}

/* ── TOGGLE SWITCH ── */
.toggle-track{background:rgba(13,79,46,.3);border:1px solid rgba(212,175,55,.3);transition:all .3s;cursor:pointer;}
.toggle-track.on{background:linear-gradient(135deg,var(--gold-dark),var(--gold));box-shadow:0 0 20px rgba(212,175,55,.4);}
.toggle-thumb{background:var(--cream);transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,.4);}
.toggle-track.on .toggle-thumb{transform:translateX(28px);}

/* ── SECTION DIVIDER ── */
.divider{height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:2rem auto;max-width:300px;}

/* ── PARTICLES ── */
.particle{position:fixed;pointer-events:none;z-index:1;}

/* ── COUNTDOWN ── */
.countdown-box{background:linear-gradient(135deg,rgba(13,79,46,.4),rgba(5,14,7,.6));border:1px solid rgba(212,175,55,.4);backdrop-filter:blur(10px);}

/* ── MUSIC PLAYER ── */
.music-btn{background:linear-gradient(135deg,var(--emerald),var(--emerald-mid));border:2px solid var(--gold);animation:pulse-gold 3s ease-in-out infinite;}

/* ── RSVP CARD ── */
.rsvp-option{border:2px solid rgba(212,175,55,.3);transition:all .3s;cursor:pointer;}
.rsvp-option.selected{border-color:var(--gold);background:rgba(212,175,55,.2);box-shadow:0 0 20px rgba(212,175,55,.3);}

/* ── WISHCARD ── */

/* ── ADMIN ── */
.admin-card{background:rgba(10,26,12,.8);border:1px solid rgba(212,175,55,.2);backdrop-filter:blur(15px);}
.stat-card{background:linear-gradient(135deg,rgba(13,79,46,.4),rgba(5,14,7,.6));border:1px solid rgba(212,175,55,.3);}

/* ── MOSQUE SILHOUETTE ── */
.mosque{position:absolute;bottom:0;width:100%;pointer-events:none;opacity:.15;}

/* ── RESPONSIVE ── */
@media(min-width:768px){
  body{font-size:1.1rem;}
  .max-mobile{max-width:480px;margin:auto;}
}

const ls={
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
  rm:(k)=>{try{localStorage.removeItem(k);}catch{}},
};

const getVisitorId=()=>{let id=ls.get('visitor_id');if(!id){id='v_'+Date.now()+'_'+Math.random().toString(36).slice(2);ls.set('visitor_id',id);}return id;};
const getDevice=()=>(/Mobi|Android/i.test(navigator.userAgent)?'Mobile':'Desktop');
const getBrowser=()=>{const ua=navigator.userAgent;if(ua.includes('Chrome'))return 'Chrome';if(ua.includes('Firefox'))return 'Firefox';if(ua.includes('Safari'))return 'Safari';return 'Other';};

const trackVisitor=(name)=>{
  const visitors=ls.get('visitors',[]);
  const entry={id:getVisitorId(),name,device:getDevice(),browser:getBrowser(),timestamp:new Date().toISOString(),duration:0};
  const existing=visitors.findIndex(v=>v.id===entry.id);
  if(existing>=0)visitors[existing]={...visitors[existing],lastVisit:entry.timestamp,visits:(visitors[existing].visits||1)+1};
  else visitors.push({...entry,visits:1});
  ls.set('visitors',visitors);
  sessionStorage.setItem('entry_time',Date.now());
};

const formatCountdown=(ms)=>{
  if(ms<=0)return{d:'00',h:'00',m:'00',s:'00'};
  const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000);
  return{d:String(d).padStart(2,'0'),h:String(h).padStart(2,'0'),m:String(m).padStart(2,'0'),s:String(s).padStart(2,'0')};
};

// ── PARTICLE SYSTEM ────────────────────────────
const ParticleSystem=({theme})=>{
  const [particles,setParticles]=useState([]);
  useEffect(()=>{
    const generate=()=>{
      const arr=[];
      for(let i=0;i<20;i++){
        arr.push({
          id:i,x:Math.random()*100,delay:Math.random()*8,
          duration:6+Math.random()*10,size:4+Math.random()*12,
          type:theme,
        });
      }
      setParticles(arr);
    };
    generate();
  },[theme]);

  const renderParticle=(p)=>{
    const base={
      position:'fixed',left:`${p.x}%`,bottom:'-50px',
      animation:`floatUp ${p.duration}s ${p.delay}s linear infinite`,
      pointerEvents:'none',zIndex:1,
    };
    if(p.type==='hearts')return <div key={p.id} style={{...base,fontSize:`${p.size}px`}}>💛</div>;
    if(p.type==='sparkles')return <div key={p.id} style={{...base,width:p.size,height:p.size,background:'radial-gradient(circle,#F5D06B,transparent)',borderRadius:'50%'}}/>;
    if(p.type==='lanterns')return <div key={p.id} style={{...base,fontSize:`${p.size}px`}}>🪔</div>;
    return <div key={p.id} style={{...base,width:4,height:4,background:'#D4AF37',borderRadius:'50%',boxShadow:'0 0 6px #D4AF37'}}/>;
  };
  return <>{particles.map(renderParticle)}</>;
};

// ── COUNTDOWN TIMER ────────────────────────────
const Countdown=({date})=>{
  const [time,setTime]=useState({d:'00',h:'00',m:'00',s:'00'});
  useEffect(()=>{
    const update=()=>{const diff=new Date(date)-Date.now();setTime(formatCountdown(diff));};
    update();const t=setInterval(update,1000);return()=>clearInterval(t);
  },[date]);
  const boxes=([['Days',time.d],['Hours',time.h],['Minutes',time.m],['Seconds',time.s]]);
  return(
    <div style={{display:'flex',gap:'1rem',justifyContent:'center',flexWrap:'wrap'}}>
      {boxes.map(([label,val])=>(
        <div key={label} className="countdown-box animate-countdown" style={{textAlign:'center',padding:'.8rem 1.2rem',borderRadius:12,minWidth:70}}>
          <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'2rem',fontWeight:700}} className="gold-text">{val}</div>
          <div style={{fontSize:'.65rem',letterSpacing:'.15em',color:'rgba(212,175,55,.6)',textTransform:'uppercase',marginTop:'.2rem'}}>{label}</div>
        </div>
      ))}
    </div>
  );
};

  const handleSubmit=async()=>{
    if(!form.name.trim())return;
    setStatus('sending');
    const rsvps=ls.get('rsvps',[]);
    rsvps.push({...form,timestamp:new Date().toISOString()});
    ls.set('rsvps',rsvps);

    // Simulate email send (EmailJS would go here)
    await new Promise(r=>setTimeout(r,1500));
    setStatus('success');
  };

  if(status==='success')return(
    <section style={{padding:'4rem 1.5rem',background:'linear-gradient(180deg,#050E07,#0A1A0C)',textAlign:'center'}}>
      <div style={{maxWidth:400,margin:'0 auto'}}>
        <div style={{fontSize:'4rem',marginBottom:'1rem'}}>✨</div>
        <div style={{fontFamily:"'Great Vibes',cursive",fontSize:'2.5rem',marginBottom:'.5rem'}} className="gold-text">JazakAllah Khair</div>
        <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:'1.1rem',color:'rgba(253,248,231,.7)'}}>Your RSVP has been received. We look forward to celebrating with you!</div>
      </div>
    </section>
  );

  return(
    <section style={{padding:'4rem 1.5rem',background:'linear-gradient(180deg,#050E07,#0A1A0C)'}}>
      <div style={{textAlign:'center',marginBottom:'2.5rem'}}>
        <div style={{fontFamily:"'Amiri',serif",fontSize:'1.2rem',color:'rgba(212,175,55,.6)',marginBottom:'.5rem'}}>التأكيد</div>
        <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'1.5rem',marginBottom:'.5rem'}} className="gold-text">RSVP</div>
        <div className="divider"/>
      </div>

      <div style={{maxWidth:480,margin:'0 auto'}}>
        <div className="glass" style={{borderRadius:20,padding:'2rem'}}>
          <div style={{marginBottom:'1.2rem'}}>
            <label style={{display:'block',fontFamily:"'Cormorant Garamond',serif",color:'rgba(212,175,55,.7)',fontSize:'.85rem',marginBottom:'.4rem',letterSpacing:'.1em'}}>YOUR NAME</label>
            <input className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10}} placeholder="Your Full Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
          </div>

          <div style={{marginBottom:'1.2rem'}}>
            <label style={{display:'block',fontFamily:"'Cormorant Garamond',serif",color:'rgba(212,175,55,.7)',fontSize:'.85rem',marginBottom:'.4rem',letterSpacing:'.1em'}}>NUMBER OF GUESTS</label>
            <input className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10}} type="number" min="1" max="10" value={form.guests} onChange={e=>setForm({...form,guests:e.target.value})}/>
          </div>

          <div style={{marginBottom:'1.2rem'}}>
            <label style={{display:'block',fontFamily:"'Cormorant Garamond',serif",color:'rgba(212,175,55,.7)',fontSize:'.85rem',marginBottom:'.8rem',letterSpacing:'.1em'}}>WILL YOU ATTEND?</label>
            <div style={{display:'flex',gap:'1rem'}}>
              {[['yes','✓ Yes, InshaAllah'],['no','✗ Unable to Attend']].map(([val,label])=>(
                <div key={val} className={`rsvp-option${form.attending===val?' selected':''}`} style={{flex:1,padding:'.9rem',borderRadius:10,textAlign:'center',cursor:'pointer',fontFamily:"'Cormorant Garamond',serif",fontSize:'.9rem',color:form.attending===val?'var(--gold)':'rgba(253,248,231,.6)'}} onClick={()=>setForm({...form,attending:val})}>
                  {label}
                </div>
              ))}
            </div>
          </div>

          <div style={{marginBottom:'1.5rem'}}>
            <label style={{display:'block',fontFamily:"'Cormorant Garamond',serif",color:'rgba(212,175,55,.7)',fontSize:'.85rem',marginBottom:'.4rem',letterSpacing:'.1em'}}>SPECIAL MESSAGE (OPTIONAL)</label>
            <textarea className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10,minHeight:100,resize:'vertical'}} placeholder="Any dietary requirements or special requests..." value={form.message} onChange={e=>setForm({...form,message:e.target.value})}/>
          </div>

          <button onClick={handleSubmit} className="btn-gold animate-pulse-gold" style={{width:'100%',padding:'1rem',borderRadius:12,border:'none',fontSize:'1rem',cursor:'pointer'}} disabled={status==='sending'}>
            {status==='sending'?'✦ Sending...':'✦ Confirm Attendance ✦'}
          </button>
        </div>
      </div>
    </section>
  );
};

// ── WISHES SECTION ─────────────────────────────
const WishesSection=({guestName})=>{
  const [form,setForm]=useState({name:guestName||'',message:''});
  const [sent,setSent]=useState(false);
  const [wishes,setWishes]=useState(()=>ls.get('wishes',[]));

  const handleSubmit=async()=>{
    if(!form.name.trim()||!form.message.trim())return;
    const wish={...form,timestamp:new Date().toISOString(),id:Date.now()};
    const updated=[wish,...wishes].slice(0,20);
    ls.set('wishes',updated);
    setWishes(updated);
    setSent(true);
    setTimeout(()=>{setSent(false);setForm({name:'',message:''});},2000);
  };

  return(
    <section style={{padding:'4rem 1.5rem',background:'linear-gradient(180deg,#0A1A0C,#050E07)'}}>
      <div style={{textAlign:'center',marginBottom:'2.5rem'}}>

        <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'1.5rem',marginBottom:'.5rem'}} className="gold-text">Wishes & Blessings</div>
        <div className="divider"/>
      </div>

      <div style={{maxWidth:480,margin:'0 auto'}}>
        <div className="glass" style={{borderRadius:20,padding:'1.5rem',marginBottom:'2rem'}}>
          <input className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10,marginBottom:'1rem'}} placeholder="Your Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/>
          <textarea className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10,minHeight:100,resize:'vertical',marginBottom:'1rem'}} placeholder="Send your duas and blessings to the couple..." value={form.message} onChange={e=>setForm({...form,message:e.target.value})}/>
          <button onClick={handleSubmit} className="btn-gold" style={{width:'100%',padding:'.9rem',borderRadius:10,border:'none',cursor:'pointer'}}>
            {sent?'✓ Sent JazakAllah!':'💌 Send Blessings'}
          </button>
        </div>

        {/* Wish cards */}
        {wishes.map(w=>(
          <div key={w.id} className="wish-card" style={{borderRadius:16,padding:'1.2rem',marginBottom:'1rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:'.5rem'}}>
              <div style={{fontFamily:"'Great Vibes',cursive",fontSize:'1.3rem',color:'var(--gold-light)'}}>{w.name}</div>
              <div style={{fontSize:'.7rem',color:'rgba(253,248,231,.3)',fontFamily:"'Cormorant Garamond',serif"}}>{new Date(w.timestamp).toLocaleDateString()}</div>
            </div>
            <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:'.9rem',color:'rgba(253,248,231,.7)',lineHeight:1.5,fontStyle:'italic'}}>"{w.message}"</div>
          </div>
        ))}
        {wishes.length===0&&(
          <div style={{textAlign:'center',color:'rgba(212,175,55,.4)',fontFamily:"'Cormorant Garamond',serif",fontStyle:'italic',fontSize:'.9rem'}}>
            Be the first to send your blessings ✨
          </div>
        )}
      </div>
    </section>
  );
};

const AdminLogin=({onLogin})=>{
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const handleLogin=async()=>{
    setLoading(true);
    await new Promise(r=>setTimeout(r,800));
    if(u===ADMIN_USER&&p===ADMIN_PASS){
      ls.set('admin_session',{token:'admin_'+Date.now(),login:new Date().toISOString()});
      onLogin();
    }else{setErr('Invalid credentials. Please try again.');}
    setLoading(false);
  };

  return(
    <div style={{minHeight:'100vh',background:'radial-gradient(ellipse at center,#0D4F2E,#050E07)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'2rem'}}>

          <div style={{color:'rgba(212,175,55,.5)',fontSize:'.85rem',fontFamily:"'Cormorant Garamond',serif"}}>Royal Engagement Dashboard</div>

        <div className="glass" style={{borderRadius:20,padding:'2rem'}}>
          <input className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10,marginBottom:'1rem'}} placeholder="Username" value={u} onChange={e=>setU(e.target.value)}/>
          <input type="password" className="premium-input" style={{width:'100%',padding:'.9rem 1rem',borderRadius:10,marginBottom:'1rem'}} placeholder="Password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleLogin()}/>

  );
};

                {[
                  ['groomName','Groom Name'],['brideName','Bride Name'],
                  ['groomFull','Groom Full Name'],['brideFull','Bride Full Name'],
                  ['initials','Couple Initials'],['engagementDate','Engagement Date (YYYY-MM-DD)'],
                  ['engagementTime','Engagement Time'],['venueName','Venue Name'],
                  ['venueAddress','Full Address'],['mapsLink','Google Maps Link'],
                  ['islamicQuote','Islamic Quote (Arabic)'],['islamicQuoteTranslation','Quote Translation'],
                  ['customDua','Custom Dua'],['welcomeMsg','Welcome Message'],
                  ['invitationMsg','Invitation Message'],['dressCode','Dress Code'],
                  ['whatsappNumber','WhatsApp Number'],['familyNames','Family Names'],
                  ['footerText','Footer Text'],['saveTheDateText','Save The Date Text'],
                ].map(([field,label])=>(
                  <div key={field} style={{marginBottom:'1rem'}}>
                    <label style={{display:'block',fontSize:'.7rem',color:'rgba(212,175,55,.6)',marginBottom:'.3rem',fontFamily:"'Cormorant Garamond',serif",letterSpacing:'.1em',textTransform:'uppercase'}}>{label}</label>
                    <input className="premium-input" style={{width:'100%',padding:'.7rem .9rem',borderRadius:8,fontSize:'.9rem'}} value={contentData[field]||''} onChange={e=>handleContentChange(field,e.target.value)}/>
                  </div>
                ))}
              </div>
            )}
          </>
        )}

        {/* GALLERY MANAGER */}
        {tab==='gallery'&&(
          <>
            <Toggle label="Use Personal Images & Gallery" desc="Upload your own photos" value={toggles.images} onChange={v=>setToggles({...toggles,images:v})}/>
            {toggles.images&&(
              <div style={{marginTop:'1rem'}}>
                <label className="btn-gold" style={{display:'block',padding:'1rem',borderRadius:12,textAlign:'center',cursor:'pointer',fontFamily:"'Cinzel Decorative',serif",fontSize:'.75rem',letterSpacing:'.1em',border:'none',marginBottom:'1.5rem'}}>
                  📁 Upload Photos
                  <input type="file" accept="image/*" multiple style={{display:'none'}} onChange={handleImageUpload}/>
                </label>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'.8rem'}}>
                  {personalImages.map((img,i)=>(
                    <div key={img.id} style={{position:'relative',borderRadius:8,overflow:'hidden',border:'1px solid rgba(212,175,55,.2)'}}>
                      <img src={img.url} alt="" style={{width:'100%',aspectRatio:'1',objectFit:'cover',display:'block'}}/>
                      <button onClick={()=>{const u=personalImages.filter((_,j)=>j!==i);setPersonalImages(u);ls.set('personal_images',u);}} style={{position:'absolute',top:4,right:4,background:'rgba(200,0,0,.8)',border:'none',color:'white',width:24,height:24,borderRadius:'50%',cursor:'pointer',fontSize:'.8rem'}}>×</button>
                    </div>
                  ))}
                </div>
                {personalImages.length===0&&<div style={{textAlign:'center',color:'rgba(253,248,231,.3)',padding:'3rem',fontStyle:'italic',fontFamily:"'Cormorant Garamond',serif"}}>No images uploaded yet</div>}
              </div>
            )}
          </>
        )}

        {/* SETTINGS */}
        {tab==='settings'&&(
          <div>
            <div style={{fontFamily:"'Cinzel Decorative',serif",fontSize:'.8rem',color:'rgba(212,175,55,.7)',marginBottom:'1rem',letterSpacing:'.2em'}}>ALL TOGGLES</div>
            <Toggle label="Use Personal Engagement Content" desc="Show real couple details instead of demo data" value={toggles.content} onChange={v=>setToggles({...toggles,content:v})}/>
            <Toggle label="Use Personal Images & Gallery" desc="Show uploaded photos instead of placeholders" value={toggles.images} onChange={v=>setToggles({...toggles,images:v})}/>
            <Toggle label="Use Personal Animation & Video Media" desc="Use custom videos instead of auto-animations" value={toggles.videos} onChange={v=>setToggles({...toggles,videos:v})}/>

            <div style={{marginTop:'2rem',fontFamily:"'Cinzel Decorative',serif",fontSize:'.8rem',color:'rgba(212,175,55,.7)',marginBottom:'1rem',letterSpacing:'.2em'}}>DANGER ZONE</div>
            <button onClick={()=>{if(confirm('Clear all data?')){['rsvps','wishes','visitors','events','personal_images','custom_content'].forEach(k=>ls.rm(k));alert('Cleared!');window.location.reload();}}} style={{width:'100%',padding:'1rem',borderRadius:12,background:'rgba(200,0,0,.15)',border:'1px solid rgba(200,0,0,.3)',color:'#ff6b6b',cursor:'pointer',fontFamily:"'Cinzel Decorative',serif",fontSize:'.75rem',letterSpacing:'.1em'}}>
              🗑 Clear All Data
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════
const App=()=>{
  const path=window.location.pathname;

  // STATE
  const [stage,setStage]=useState('loading'); // loading | intro | name | main
  const [guestName,setGuestName]=useState(()=>ls.get('guest_name',''));
  const [adminLoggedIn,setAdminLoggedIn]=useState(()=>!!ls.get('admin_session'));
  const [toggles,setToggles]=useState(()=>ls.get('admin_toggles',{content:false,images:false,videos:false}));
  const [contentData,setContentData]=useState(()=>({...DEMO_DATA,...(ls.get('custom_content')||{})}));
  const [personalImages,setPersonalImages]=useState(()=>ls.get('personal_images',[]));
  const [animTheme,setAnimTheme]=useState(ANIMATION_THEMES[0]);
  const [activeSection,setActiveSection]=useState(0);

  const displayData=toggles.content?{...DEMO_DATA,...contentData}:DEMO_DATA;

  // Save toggles
  useEffect(()=>ls.set('admin_toggles',toggles),[toggles]);

  // Animation rotation every 2 min
  useEffect(()=>{
    const t=setInterval(()=>{
      setAnimTheme(prev=>{
        const i=ANIMATION_THEMES.indexOf(prev);
        return ANIMATION_THEMES[(i+1)%ANIMATION_THEMES.length];
      });
    },120000);
    return()=>clearInterval(t);
  },[]);

  // Auto-advance loading
  const handleLoadDone=useCallback(()=>{
    if(guestName)setStage('main');
    else setStage('intro');
  },[guestName]);

  // ADMIN ROUTES
  if(path==='/admin-login'||path.includes('admin-login')){
    if(adminLoggedIn)return<AdminDashboard onLogout={()=>{setAdminLoggedIn(false);ls.rm('admin_session');}} contentData={contentData} setContentData={setContentData} toggles={toggles} setToggles={setToggles} personalImages={personalImages} setPersonalImages={setPersonalImages}/>;
    return<AdminLogin onLogin={()=>setAdminLoggedIn(true)}/>;
  }
  if(path==='/admin-dashboard'||path.includes('admin-dashboard')){
    if(!adminLoggedIn)return<AdminLogin onLogin={()=>setAdminLoggedIn(true)}/>;
    return<AdminDashboard onLogout={()=>{setAdminLoggedIn(false);ls.rm('admin_session');}} contentData={contentData} setContentData={setContentData} toggles={toggles} setToggles={setToggles} personalImages={personalImages} setPersonalImages={setPersonalImages}/>;
  }

  // MAIN FLOW
  if(stage==='loading')return<LoadingScreen onDone={handleLoadDone}/>;
  if(stage==='intro')return<IntroScreen onEnter={()=>setStage('name')}/>;
  if(stage==='name')return<NameEntry onSubmit={n=>{setGuestName(n);setStage('main');}}/>;

  const navSections=[
    {id:'hero',label:'Home'},{id:'story',label:'Story'},{id:'gallery',label:'Gallery'},
    {id:'event',label:'Event'},{id:'invitation',label:'Invite'},{id:'rsvp',label:'RSVP'},{id:'wishes',label:'Wishes'},
  ];

  return(
    <div style={{position:'relative'}}>
      {/* Background particles (non-video mode) */}
      {!toggles.videos&&<ParticleSystem theme={animTheme}/>}

      {/* Scroll Nav */}
      <ScrollNav sections={navSections} active={activeSection}/>

      {/* Fixed bottom nav */}
      <div style={{position:'fixed',bottom:0,left:0,right:0,background:'rgba(5,14,7,.95)',borderTop:'1px solid rgba(212,175,55,.2)',backdropFilter:'blur(20px)',padding:'.5rem',display:'flex',justifyContent:'space-around',zIndex:40}}>
        {navSections.map((s,i)=>(
          <button key={s.id} onClick={()=>{document.getElementById(s.id)?.scrollIntoView({behavior:'smooth'});setActiveSection(i);}} style={{background:'none',border:'none',color:activeSection===i?'var(--gold)':'rgba(253,248,231,.4)',cursor:'pointer',fontSize:'.6rem',fontFamily:"'Cinzel Decorative',serif",letterSpacing:'.05em',padding:'.3rem .4rem',transition:'all .2s',display:'flex',flexDirection:'column',alignItems:'center',gap:2}}>
            {s.label}
          </button>
        ))}
      </div>

      {/* Admin quick link */}
      <a href="/admin-login" style={{position:'fixed',top:12,right:12,background:'rgba(212,175,55,.1)',border:'1px solid rgba(212,175,55,.3)',color:'rgba(212,175,55,.6)',padding:'.3rem .7rem',borderRadius:20,fontSize:'.65rem',textDecoration:'none',fontFamily:"'Cormorant Garamond',serif",zIndex:40,backdropFilter:'blur(10px)'}}>Admin</a>

      <MusicPlayer/>

      {/* SECTIONS */}
      <div id="hero"><HeroSection data={displayData} guestName={guestName}/></div>
      <div id="story"><StorySection data={displayData}/></div>
      <div id="gallery"><GallerySection personalImages={personalImages} usePersonal={toggles.images}/></div>
      <div id="event"><EventSection data={displayData}/></div>
      <div id="invitation"><InvitationCard data={displayData} guestName={guestName}/></div>
      <div id="rsvp"><RSVPSection data={displayData} guestName={guestName}/></div>
      <div id="wishes"><WishesSection guestName={guestName}/></div>
      <Footer data={displayData}/>
    </div>
  );
};

// Mount
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
